<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <script>
        function showWelcome() {
    
    var userName = document.getElementById("nameField").value;

    if (userName.length > 3) {
        document.getElementById("result").innerText = "Welcome to the site " + userName;
    } else {
        document.getElementById("result").innerText = "Name must be longer than 3 characters.";
    }
}
    </script>
</head>
<body>
    <p>What is your name?</p>

<input type="text" id="nameField">

<button onclick="showWelcome()">Submit</button>

<h2 id="result"></h2>
</body>
</html>
